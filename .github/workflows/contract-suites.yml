# .github/workflows/contract-suites.yml — deployment-level checks (ADR-0024 D1, D5; issue #293)
#
# This repository's standing layer: the checks whose defect surfaces only after
# deployment — the shipped artifact installs or stamps (`packaging`), and a
# declared inventory agrees with the tree it describes (`manifest`). A change's
# functional verification is a one-shot cycle run recorded in the PR body, not a
# step here (docs/development-guideline.md > 7. Testing Policy).
#
# Every step runs on every pull request and every push to main. There is no
# `paths:` filter, so no check can read green while its step never ran, and no
# selection step: this repository does not opt in to the suite plane. Each check
# is its own step so a failure attributes to its own name. The plugin package
# and the dummy-target E2E keep their own workflows (plugin-package.yml,
# e2e-dummy-target.yml).
#
# Why GitHub Actions: every step is pure bash + jq with no `bats` and no
# node/npm.
#
# Enforcement level: ADVISORY, as for every other workflow in this repo — this
# plan provides no branch-protection required-status-checks, so a red run
# surfaces a signal the external reviewer confirms green before merging.

name: contract-suites

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contract-suites:
    name: deployment-level checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: verify-install-into-target.sh
        timeout-minutes: 10
        run: bash tests/plugin/verify-install-into-target.sh

      - name: verify-install-skill-scripts.sh
        timeout-minutes: 10
        run: bash tests/plugin/verify-install-skill-scripts.sh

      - name: verify-thin-root-layer.sh
        timeout-minutes: 10
        run: bash tests/plugin/verify-thin-root-layer.sh

      - name: test-issue-236-restamp-removal.sh
        timeout-minutes: 10
        run: bash tests/test-issue-236-restamp-removal.sh

      - name: test-issue-979-bundle-delivery.sh
        timeout-minutes: 10
        run: bash tests/test-issue-979-bundle-delivery.sh

      - name: test-cycle-layer-devices-shipped.sh
        timeout-minutes: 10
        run: bash tests/test-cycle-layer-devices-shipped.sh

      - name: manifest regen-clean lint
        run: bash scripts/test/check-manifest-regen-clean.sh

      - name: suite CI-coverage lint
        run: bash scripts/test/check-suite-ci-coverage.sh

      - name: tests-tree hygiene lint
        run: bash scripts/test/check-tests-tree-hygiene.sh
