# .github/workflows/contract-suites.yml — contract suites and standing lints (issue #76)
#
# Gives every previously-unregistered suite a real execution path, and registers
# the three standing lints this cycle promotes.
#
# Why a NEW workflow rather than new entries in e2e-dummy-target.yml: that file's
# first `paths:` block is read by live suites through a FIXED 40-line window, and
# the window is saturated — the last literal those guards require sits on the
# window's final line, so any entry inserted above it evicts a literal and turns
# three unrelated green suites red. Removals from that block are safe (they only
# pull entries up) and are all this cycle makes there; additions land here. This
# also follows the one-workflow-per-subject precedent the tree already sets
# (schema-hook-contract.yml, host-purity-delta.yml).
#
# Why GitHub Actions: every step is pure bash + jq with no `bats` and no node/npm
# — the same zero-infra rationale the three existing workflows state in their own
# headers. `bats` in particular is unavailable here BY DESIGN, which is why the
# tests/issue-92 set was split by assertion shape rather than registered.
#
# Each suite is its own step so a failure attributes to its own name rather than
# to a shared shell.
#
# Trigger coverage: the `paths:` blocks below carry every path declared by a
# registered suite's `# ci-subject:` header, plus each suite file itself. That
# correspondence is what tests/test-issue-76-orphan-registration.sh's
# registration-effectiveness oracle asserts — a `run:` step alone does not give a
# suite regression protection if its own subject's edit never fires the workflow.
#
# Enforcement level: ADVISORY, as for every other workflow in this repo — this
# plan provides no branch-protection required-status-checks, so a red run
# surfaces a signal the external reviewer confirms green before merging.

