permissions:
  contents: read

jobs:
  contract-suites:
    name: contract suites and standing lints
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # Full history, so a base-ref-consuming guard in this workflow
          # cannot skip SILENTLY on a shallow checkout. The remaining consumer
          # here (tests/test-issue-795-handoff-removal.sh's AC-KEEP-LABEL
          # merge-base arm) resolves its base as
          # `git merge-base HEAD main 2>/dev/null || echo ""` and, on an empty
          # BASE_REF, prints SKIP and increments TESTS while asserting
          # nothing. Reducing the depth therefore shows up as silent coverage
          # loss, not as a red run — which is exactly why this line must not
          # be read as a no-op guard and trimmed.
          fetch-depth: 0

      # Selection (issue #103): scripts/test/select-suites.sh is the SOLE owner of
      # "which suites does this change require". Each governed suite step below
      # guards on this step's output; nothing here reimplements the predicate.
      # Under a push event, or an empty delta from a resolved base, it selects
      # the full set — the push delta is empty by construction, so a purely
      # delta-driven selector would silently lose all coverage.
      - id: select
        name: select suites for this change
        timeout-minutes: 5
        run: |
          rc=0
          bash scripts/test/select-suites.sh --event "$GITHUB_EVENT_NAME" \
            > "$RUNNER_TEMP/selected-raw.txt" \
            2> "$RUNNER_TEMP/selection-report.txt" || rc=$?
          cat "$RUNNER_TEMP/selection-report.txt"
          if [ "$rc" -ne 0 ]; then
            echo "select-suites exited $rc — refusing to run with an unresolved selection" >&2
            exit "$rc"
          fi
          paste -sd' ' - < "$RUNNER_TEMP/selected-raw.txt" > "$RUNNER_TEMP/selected.txt"
          printf 'suites=%s\n' "$(cat "$RUNNER_TEMP/selected.txt")" >> "$GITHUB_OUTPUT"

      - name: test-workflow-trigger-conformance.sh
        id: s-test-workflow-trigger-conformance
        if: contains(format(' {0} ', steps.select.outputs.suites), ' tests/test-workflow-trigger-conformance.sh ')
        timeout-minutes: 10
        run: bash tests/test-workflow-trigger-conformance.sh

      - name: test-push-context-base-ref.sh
        id: s-test-push-context-base-ref
        if: contains(format(' {0} ', steps.select.outputs.suites), ' tests/test-push-context-base-ref.sh ')
        timeout-minutes: 10
        run: bash tests/test-push-context-base-ref.sh

      - name: test-bounded-execution-fallback.sh
        id: s-test-bounded-execution-fallback
        if: contains(format(' {0} ', steps.select.outputs.suites), ' tests/test-bounded-execution-fallback.sh ')
        timeout-minutes: 3
        run: bash tests/test-bounded-execution-fallback.sh

      - name: verify-install-into-target.sh
        id: s-verify-install-into-target
        if: contains(format(' {0} ', steps.select.outputs.suites), ' tests/plugin/verify-install-into-target.sh ')
        timeout-minutes: 10
        run: bash tests/plugin/verify-install-into-target.sh

      - name: verify-install-skill-scripts.sh
        id: s-verify-install-skill-scripts
        if: contains(format(' {0} ', steps.select.outputs.suites), ' tests/plugin/verify-install-skill-scripts.sh ')
        timeout-minutes: 10
        run: bash tests/plugin/verify-install-skill-scripts.sh

      - name: verify-thin-root-layer.sh
        id: s-verify-thin-root-layer
        if: contains(format(' {0} ', steps.select.outputs.suites), ' tests/plugin/verify-thin-root-layer.sh ')
