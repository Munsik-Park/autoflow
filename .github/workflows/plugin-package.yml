# .github/workflows/plugin-package.yml — plugin packaging acceptance suite (issue #790)
#
# Runs the plugin packaging acceptance suite (tests/plugin/verify-package.sh),
# which checks that the shipped plugin under plugin/autoflow/ and the self-hosted
# marketplace at .claude-plugin/marketplace.json package correctly: manifest and
# marketplace validity, hooks.json wiring under ${CLAUDE_PLUGIN_ROOT}, one
# invocation of the packaged gate hook, byte-copy parity with the .claude/
# originals and structure conformance — deployment-level checks only (ADR-0024
# D1; issue #293). It runs on every pull request and every push to main, with no
# `paths:` filter.
#
# Why GitHub Actions: the suite is pure POSIX sh + jq/cmp/diff -r/grep/git with
# no node/npm, no bats, and no submodule checkout; ubuntu-latest ships bash 5.x +
# git + jq.
#
# Enforcement level: ADVISORY. This repo's plan provides no branch-protection /
# required-status-checks, so a red run here does NOT auto-block merge; it surfaces a
# pass/fail signal the external reviewer confirms green before merging.

name: plugin-package

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  plugin-package:
    name: plugin packaging acceptance suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Run plugin packaging acceptance suite
        timeout-minutes: 10
        run: bash tests/plugin/verify-package.sh
