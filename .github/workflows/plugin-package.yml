# .github/workflows/plugin-package.yml — plugin packaging acceptance suite (issue #790)
#
# Runs the plugin packaging acceptance suite (tests/plugin/verify-package.sh), which
# validates the shipped plugin under plugin/autoflow/ and the self-hosted marketplace
# at .claude-plugin/marketplace.json: manifest/marketplace validity, hooks.json wiring
# under ${CLAUDE_PLUGIN_ROOT}, state-path separation via ${CLAUDE_PROJECT_DIR}, byte-copy
# parity with the .claude/ originals, engine-core-unchanged (empty diff), structure
# conformance, and the README settings-pin reference snippet (AC1-AC6).
#
# Why GitHub Actions: the suite is pure POSIX sh + jq/cmp/diff -r/grep/git with no
# node/npm, no bats, and no submodule checkout — the same zero-infra rationale as
# host-purity-delta.yml / schema-hook-contract.yml. ubuntu-latest ships bash 5.x +
# git + jq; the engine-core-unchanged check needs the merge-base against origin/main,
# so checkout uses fetch-depth: 0.
#
# Enforcement level: ADVISORY. This repo's plan provides no branch-protection /
# required-status-checks, so a red run here does NOT auto-block merge; it surfaces a
# pass/fail signal the external reviewer confirms green before merging.

name: plugin-package

on:
  pull_request:
    paths:
      - 'plugin/**'
      - '.claude-plugin/**'
      - '.claude/hooks/**'
      - '.claude/agents/**'
      - '.claude/skills/**'
      - 'tests/plugin/verify-package.sh'
      - '.github/workflows/plugin-package.yml'
  push:
    branches: [main]
    paths:
      - 'plugin/**'
      - '.claude-plugin/**'
      - '.claude/hooks/**'
      - '.claude/agents/**'
      - '.claude/skills/**'
      - 'tests/plugin/verify-package.sh'
      - '.github/workflows/plugin-package.yml'

permissions:
  contents: read

jobs:
  plugin-package:
    name: plugin packaging acceptance suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      # Selection (issue #103): scripts/test/select-suites.sh is the SOLE owner of
      # "which suites does this change require". Each governed suite step below
      # guards on this step's output; nothing here reimplements the predicate.
      # Under a push event, or an empty delta from a resolved base, it selects
      # the full set — the push delta is empty by construction, so a purely
      # delta-driven selector would silently lose all coverage.
      - id: select
        name: select suites for this change
        run: |
          rc=0
          bash scripts/test/select-suites.sh --event "$GITHUB_EVENT_NAME" \
            > "$RUNNER_TEMP/selected-raw.txt" \
            2> "$RUNNER_TEMP/selection-report.txt" || rc=$?
          cat "$RUNNER_TEMP/selection-report.txt"
          if [ "$rc" -ne 0 ]; then
            echo "select-suites exited $rc — refusing to run with an unresolved selection" >&2
            exit "$rc"
          fi
          paste -sd' ' - < "$RUNNER_TEMP/selected-raw.txt" > "$RUNNER_TEMP/selected.txt"
          printf 'suites=%s\n' "$(cat "$RUNNER_TEMP/selected.txt")" >> "$GITHUB_OUTPUT"

      - name: Run plugin packaging acceptance suite
        id: s-verify-package
        if: contains(format(' {0} ', steps.select.outputs.suites), ' tests/plugin/verify-package.sh ')
        timeout-minutes: 10
        run: bash tests/plugin/verify-package.sh

      # Reconciliation (issue #103): a step whose `if:` evaluates false is
      # SKIPPED and the job still concludes successfully — so a green run is
      # exactly what a wrongly-false guard produces, and enforcement here is
      # advisory with no required status check behind it. This step compares the
      # run's own selection report against the run's own step outcomes, so it
      # needs no second source of truth.
      - name: reconcile selection against step outcomes
        if: always()
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
        run: |
          printf '%s' "$STEPS_JSON" > "$RUNNER_TEMP/steps.json"
          bash scripts/test/check-step-reconciliation.sh \
            --selected "$RUNNER_TEMP/selection-report.txt" \
            --steps "$RUNNER_TEMP/steps.json"
