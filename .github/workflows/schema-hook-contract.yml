# .github/workflows/schema-hook-contract.yml — state-schema ↔ gate-hook contract test (issue #223)
#
# Guards against silent drift between the runtime AutoFlow state JSON
# (.autoflow/issue-{N}.json) and the gate hook (.claude/hooks/check-autoflow-gate.sh).
# The contract test (tests/test-issue-223-schema-hook-contract.sh) treats
# tests/fixtures/gate-schema.json as the single source of truth and asserts — in BOTH
# directions — that the hook's hardcoded jq paths, numeric thresholds (7.5 / 7 / 3),
# gated phase-key set, and dual-language security-key set still match the declared
# schema. A schema-only edit or a hook-only edit that diverges turns the test red.
#
# Why GitHub Actions: the test is pure bash + jq with no node/npm and no submodule
# checkout — the same zero-infra rationale as workflow-regression.yml / image-scan.yml.
# ubuntu-latest ships bash 5.x and jq pre-installed; the test is also kept bash-3.2
# portable so the same script runs locally on macOS during AutoFlow VALIDATE.
#
# Enforcement level: ADVISORY. This repo's plan provides no GitHub branch-protection /
# required-status-checks (private-repo plan limitation — the API returns 403), so a red
# run here does NOT auto-block merge; it surfaces a pass/fail signal that the external
# reviewer confirms green before merging (the "CI green" precondition in
# docs/external-review-sequencing.md), the same enforcement path as every other CI check.

name: schema-hook-contract

on:
  pull_request:
    paths:
      - '.claude/hooks/check-autoflow-gate.sh'
      - 'tests/fixtures/gate-schema.json'
      - 'tests/fixtures/autoflow-state-canonical.json'
      - 'tests/test-issue-223-schema-hook-contract.sh'
      - 'CLAUDE.md'
      - '.github/workflows/schema-hook-contract.yml'
      - 'docs/gate-matching-standard.md'
      - 'tests/test-gate-hardening.sh'
      - 'tests/lib/**'
  push:
    branches: [main]
    paths:
      - '.claude/hooks/check-autoflow-gate.sh'
      - 'tests/fixtures/gate-schema.json'
      - 'tests/fixtures/autoflow-state-canonical.json'
      - 'tests/test-issue-223-schema-hook-contract.sh'
      - 'CLAUDE.md'
      - '.github/workflows/schema-hook-contract.yml'
      - 'docs/gate-matching-standard.md'
      - 'tests/test-gate-hardening.sh'
      - 'tests/lib/**'

permissions:
  contents: read

jobs:
  contract:
    name: state-schema ↔ gate-hook contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # select-suites.sh resolves a base ref (origin/$GITHUB_BASE_REF, then
          # origin/main) to compute the pull_request delta; a default-depth
          # checkout leaves none of those remote-tracking refs present and the
          # selector BLOCKs.
          fetch-depth: 0

      # Selection (issue #103): scripts/test/select-suites.sh is the SOLE owner of
      # "which suites does this change require". Each governed suite step below
      # guards on this step's output; nothing here reimplements the predicate.
      # Under a push event, or an empty delta from a resolved base, it selects
      # the full set — the push delta is empty by construction, so a purely
      # delta-driven selector would silently lose all coverage.
      - id: select
        name: select suites for this change
        timeout-minutes: 5
        run: |
          rc=0
          bash scripts/test/select-suites.sh --event "$GITHUB_EVENT_NAME" \
            > "$RUNNER_TEMP/selected-raw.txt" \
            2> "$RUNNER_TEMP/selection-report.txt" || rc=$?
          cat "$RUNNER_TEMP/selection-report.txt"
          if [ "$rc" -ne 0 ]; then
            echo "select-suites exited $rc — refusing to run with an unresolved selection" >&2
            exit "$rc"
          fi
          paste -sd' ' - < "$RUNNER_TEMP/selected-raw.txt" > "$RUNNER_TEMP/selected.txt"
          printf 'suites=%s\n' "$(cat "$RUNNER_TEMP/selected.txt")" >> "$GITHUB_OUTPUT"

      - name: Run schema↔hook contract test
        id: s-test-issue-223-schema-hook-contract
        if: contains(format(' {0} ', steps.select.outputs.suites), ' tests/test-issue-223-schema-hook-contract.sh ')
        timeout-minutes: 10
        run: bash tests/test-issue-223-schema-hook-contract.sh

      # Reconciliation (issue #103): a step whose `if:` evaluates false is
      # SKIPPED and the job still concludes successfully — so a green run is
      # exactly what a wrongly-false guard produces, and enforcement here is
      # advisory with no required status check behind it. This step compares the
      # run's own selection report against the run's own step outcomes, so it
      # needs no second source of truth.
      - name: reconcile selection against step outcomes
        if: always()
        timeout-minutes: 5
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
          JOB_STATUS: ${{ job.status }}
        run: |
          printf '%s' "$STEPS_JSON" > "$RUNNER_TEMP/steps.json"
          bash scripts/test/check-step-reconciliation.sh \
            --selected "$RUNNER_TEMP/selection-report.txt" \
            --job-status "$JOB_STATUS" \
            --steps "$RUNNER_TEMP/steps.json"
