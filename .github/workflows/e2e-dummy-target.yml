permissions:
  contents: read

jobs:
  e2e-dummy-target:
    name: throwaway dummy-target E2E acceptance suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      # Selection (issue #103): scripts/test/select-suites.sh is the SOLE owner of
      # "which suites does this change require". Each governed suite step below
      # guards on this step's output; nothing here reimplements the predicate.
      # Under a push event, or an empty delta from a resolved base, it selects
      # the full set — the push delta is empty by construction, so a purely
      # delta-driven selector would silently lose all coverage.
      - id: select
        name: select suites for this change
        timeout-minutes: 5
        run: |
          rc=0
          bash scripts/test/select-suites.sh --event "$GITHUB_EVENT_NAME" \
            > "$RUNNER_TEMP/selected-raw.txt" \
            2> "$RUNNER_TEMP/selection-report.txt" || rc=$?
          cat "$RUNNER_TEMP/selection-report.txt"
          if [ "$rc" -ne 0 ]; then
            echo "select-suites exited $rc — refusing to run with an unresolved selection" >&2
            exit "$rc"
          fi
          paste -sd' ' - < "$RUNNER_TEMP/selected-raw.txt" > "$RUNNER_TEMP/selected.txt"
          printf 'suites=%s\n' "$(cat "$RUNNER_TEMP/selected.txt")" >> "$GITHUB_OUTPUT"

      - name: Run throwaway dummy-target E2E acceptance suite
        id: s-verify-e2e-dummy-target
        if: contains(format(' {0} ', steps.select.outputs.suites), ' tests/plugin/verify-e2e-dummy-target.sh ')
        timeout-minutes: 10
        run: bash tests/plugin/verify-e2e-dummy-target.sh

      # init.sh legacy wizard removal + Language Rule user-scope reversion
      # guard (#952): the no-arg usage guard, the removed
      # replace_placeholders/prompt/sed_inplace machinery, the delivered
      # CLAUDE.md Language Rule absence, the submodule-common-rules
      # non-substituted notation, and the README/SETUP-GUIDE stale-template
      # purge must stay asserted. CI has no glob discovery; registered by
      # filename per the sibling suites. See
      # tests/test-issue-952-wizard-removal.sh.
      - name: Run wizard-removal guard (#952)
        id: s-test-issue-952-wizard-removal
        if: contains(format(' {0} ', steps.select.outputs.suites), ' tests/test-issue-952-wizard-removal.sh ')
        timeout-minutes: 10
        run: bash tests/test-issue-952-wizard-removal.sh

      # Cleanup archive-semantics guard (#978): scripts/cleanup/cleanup-issue.sh
      # replaces its unconditional `find -delete` with an archive `mv` to
      # $AUTOFLOW_ARCHIVE_ROOT/<repo-key>/issue-<N>-<date>/ — this suite guards
      # the move (not delete), set integrity (count + byte content), the
      # number-boundary match, the destination-exists conflict-suffix, repo-tree
      # non-interference (git status --porcelain unchanged + the hook still
      # reading a co-resident live issue as active), and the exit-65
      # inside-repo-root refuse guard. CI has no glob discovery; registered by
      # filename per the sibling suites. See
      # scripts/test/check-cleanup-issue-boundary.sh.
      - name: Run cleanup archive-semantics guard (#978)
        run: bash scripts/test/check-cleanup-issue-boundary.sh

      # Repo-key derivation guard (#978): the bounded introspection subcommand
      # `cleanup-issue.sh --print-repo-key [<url>|--no-origin]` normalizes an
      # origin URL (scp / https / ssh:// / trailing-slash+.git forms) to the
      # same Munsik-Park__autoflow slug, falls back to a runtime-computed
      # path-encoded slug with --no-origin, agrees with the live-remote no-arg
      # read, and is parsed above the .autoflow-dir existence gate (CWD
      # independence). CI has no glob discovery; registered by filename per the
      # sibling suites. See scripts/test/check-repo-key.sh.
      - name: Run repo-key derivation guard (#978)
        run: bash scripts/test/check-repo-key.sh

      # Phase-marker emitter guard (#35): the canary emitter
      # `scripts/canary/emit-phase-marker.sh` appends one phase-transition
      # record per invocation to `.autoflow/issue-<N>-phases.jsonl` and prints
      # only a `path:line` anchor, so orchestrator context growth can be joined
      # to phase boundaries from local session logs. CI has no glob discovery;
      # registered by filename per the sibling suites.
      # See tests/test-issue-35-phase-marker.sh.
      - name: Run phase-marker emitter guard (#35)
        id: s-test-issue-35-phase-marker
        if: contains(format(' {0} ', steps.select.outputs.suites), ' tests/test-issue-35-phase-marker.sh ')
        timeout-minutes: 10
        run: bash tests/test-issue-35-phase-marker.sh

      # #55 gate-score write contract at the producer site. Cycle-scoped: it
      # drives the CLAUDE.md SCORE-SHAPE-EXAMPLE fence through the real hook
      # (the digest-agreement arm that once also drove the real digest
      # emitter was dropped by #71, which retired the emitter), and asserts
      # its own CI registration on this file. Placed at the job TAIL,
      # strictly below the doc-invariant registry runner step, for the
      # reason the #51 comment above records. CI has no glob discovery;
      # registered by filename per the sibling suites. See
      # tests/test-issue-55-score-format-contract.sh.
      - name: Run gate-score write contract (#55)
        id: s-test-issue-55-score-format-contract
        if: contains(format(' {0} ', steps.select.outputs.suites), ' tests/test-issue-55-score-format-contract.sh ')
        timeout-minutes: 10
        run: bash tests/test-issue-55-score-format-contract.sh

      # Reconciliation (issue #103): a step whose `if:` evaluates false is
      # SKIPPED and the job still concludes successfully — so a green run is
      # exactly what a wrongly-false guard produces, and enforcement here is
      # advisory with no required status check behind it. This step compares the
      # run's own selection report against the run's own step outcomes, so it
      # needs no second source of truth.
      - name: reconcile selection against step outcomes
        if: always()
        timeout-minutes: 5
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
          JOB_STATUS: ${{ job.status }}
        run: |
          printf '%s' "$STEPS_JSON" > "$RUNNER_TEMP/steps.json"
          bash scripts/test/check-step-reconciliation.sh \
            --selected "$RUNNER_TEMP/selection-report.txt" \
            --job-status "$JOB_STATUS" \
            --steps "$RUNNER_TEMP/steps.json"
