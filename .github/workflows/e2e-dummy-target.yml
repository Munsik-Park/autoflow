# .github/workflows/e2e-dummy-target.yml — throwaway dummy-target E2E suite (issue #797 [#785-S10])
#
# Runs tests/plugin/verify-e2e-dummy-target.sh: the plugin package laid out as
# an install lays it out, against a structurally-real, zero-submodule dummy
# library target that carries no AutoFlow file (ADR-0027). The scripts and the
# gate hook resolve the plugin root, the records live under the record root
# outside the target (whose tree stays clean), the hook's denies hold with no
# state, the target's spawn policy wins over the plugin default, the hook's
# advisory finds its helper and the target check runs fail-closed —
# deployment-level checks only (ADR-0024 D1; issue #293). It runs on every pull
# request and every push to main, with no `paths:` filter.
#
# Why GitHub Actions: the suite is pure bash + jq/git/tar/grep with no node/npm,
# no bats, and no submodule checkout; ubuntu-latest ships bash 5.x + git + jq.
#
# One file per subject: a dedicated sibling workflow, not a job added to
# plugin-package.yml.
#
# Enforcement level: ADVISORY. This repo's plan provides no branch-protection /
# required-status-checks, so a red run here does NOT auto-block merge; it surfaces a
# pass/fail signal the external reviewer confirms green before merging.

name: e2e-dummy-target

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  e2e-dummy-target:
    name: throwaway dummy-target E2E acceptance suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Run throwaway dummy-target E2E acceptance suite
        timeout-minutes: 10
        run: bash tests/plugin/verify-e2e-dummy-target.sh
