# .github/workflows/e2e-dummy-target.yml — throwaway dummy-target E2E suite (issue #797 [#785-S10])
#
# Runs tests/plugin/verify-e2e-dummy-target.sh, which stamps the thin-root bundle
# into a structurally-real, zero-submodule dummy library target through
# setup/init.sh and checks that the install lands intact and resolves from the
# installed location — deployment-level checks only (ADR-0024 D1; issue #293).
# It runs on every pull request and every push to main, with no `paths:` filter.
#
# Why GitHub Actions: the suite is pure POSIX sh + jq/cmp/diff/grep/awk/git with
# no node/npm, no bats, and no submodule checkout; ubuntu-latest ships bash 5.x +
# git + jq.
#
# One file per subject: a dedicated sibling workflow, not a job added to
# plugin-package.yml.
#
# Enforcement level: ADVISORY. This repo's plan provides no branch-protection /
# required-status-checks, so a red run here does NOT auto-block merge; it surfaces a
# pass/fail signal the external reviewer confirms green before merging.

name: e2e-dummy-target

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  e2e-dummy-target:
    name: throwaway dummy-target E2E acceptance suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Run throwaway dummy-target E2E acceptance suite
        timeout-minutes: 10
        run: bash tests/plugin/verify-e2e-dummy-target.sh
