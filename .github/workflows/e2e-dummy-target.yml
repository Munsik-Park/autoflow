permissions:
  contents: read

jobs:
  e2e-dummy-target:
    name: throwaway dummy-target E2E acceptance suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      # Selection (issue #103): scripts/test/select-suites.sh is the SOLE owner of
      # "which suites does this change require". Each governed suite step below
      # guards on this step's output; nothing here reimplements the predicate.
      # Under a push event, or an empty delta from a resolved base, it selects
      # the full set — the push delta is empty by construction, so a purely
      # delta-driven selector would silently lose all coverage.
      - id: select
        name: select suites for this change
        timeout-minutes: 5
        run: |
          rc=0
          bash scripts/test/select-suites.sh --event "$GITHUB_EVENT_NAME" \
            > "$RUNNER_TEMP/selected-raw.txt" \
            2> "$RUNNER_TEMP/selection-report.txt" || rc=$?
          cat "$RUNNER_TEMP/selection-report.txt"
          if [ "$rc" -ne 0 ]; then
            echo "select-suites exited $rc — refusing to run with an unresolved selection" >&2
            exit "$rc"
          fi
          paste -sd' ' - < "$RUNNER_TEMP/selected-raw.txt" > "$RUNNER_TEMP/selected.txt"
          printf 'suites=%s\n' "$(cat "$RUNNER_TEMP/selected.txt")" >> "$GITHUB_OUTPUT"

      - name: Run throwaway dummy-target E2E acceptance suite
        id: s-verify-e2e-dummy-target
        if: contains(format(' {0} ', steps.select.outputs.suites), ' tests/plugin/verify-e2e-dummy-target.sh ')
        timeout-minutes: 10
        run: bash tests/plugin/verify-e2e-dummy-target.sh

      # Topology-flip absence guard (S11a #798): claude-autoflow is the first
      # reversal case this workflow pilots — the zero-submodule single-repo
      # state must stay asserted in CI (CI has no glob discovery; registered by
      # filename per the sibling suites). See tests/test-issue-798-topology-flip.sh.
      - name: Run topology-flip detach guard (#798)
        id: s-test-issue-798-topology-flip
        if: contains(format(' {0} ', steps.select.outputs.suites), ' tests/test-issue-798-topology-flip.sh ')
        timeout-minutes: 10
        run: bash tests/test-issue-798-topology-flip.sh

      # Inert/delete cleanup guard (S11b #799): the post-#798 doc surface
      # (README consumed-tool flow, inert services=llmroute self-references,
      # INDEX.md/maintained-docs.md inert routing, git-workflow.md deferral
      # note) must stay corrected. CI has no glob discovery; registered by
      # filename per the sibling suites. See
      # tests/test-issue-799-inert-cleanup.sh.
      - name: Run inert-cleanup guard (#799)
        id: s-test-issue-799-inert-cleanup
        if: contains(format(' {0} ', steps.select.outputs.suites), ' tests/test-issue-799-inert-cleanup.sh ')
        timeout-minutes: 10
        run: bash tests/test-issue-799-inert-cleanup.sh

      # Doc-invariant registry runner (#951): the single runner that replaces
      # the per-issue doc-assertion suites (794/796/797/800/949 migrated into
      # tests/fixtures/doc-invariants.json and deleted). It reads the registry
      # via jq, resolves each entry's section by durable heading anchor, and
      # evaluates every permanent STATE invariant against the current tree.
      # Registering a new invariant thereafter is a data append to the registry
      # with no workflow edit. CI has no glob discovery; registered by filename
      # per the sibling suites. See tests/run-doc-invariants.sh and
      # docs/doc-invariant-registry.md.
      - name: Run doc-invariant registry runner (#951)
        run: bash tests/run-doc-invariants.sh

      # Spawn-mode-by-lifetime contract guard (#42, cycle-scoped): the
      # DELTA-shaped and meta assertions the permanent registry structurally
      # cannot hold — the PREFLIGHT step-1.5 / HANDOFF step-6.7 no-touch
      # fence, the gate hook + gate-schema byte-invariance fence, the
      # manifest regen-clean check, and the registry-append meta guard
      # (no embedded newline; every origin_issue:42 literal re-checked in its
      # own predicate's direction). CI has no glob discovery; registered by
      # filename per the sibling suites. See
      # tests/test-issue-42-spawn-mode-contract.sh.
      - name: Run spawn-mode contract guard (#42)
        id: s-test-issue-42-spawn-mode-contract
        if: contains(format(' {0} ', steps.select.outputs.suites), ' tests/test-issue-42-spawn-mode-contract.sh ')
        timeout-minutes: 10
        run: bash tests/test-issue-42-spawn-mode-contract.sh

      # Reporting-channel contract guard (#43, cycle-scoped): the DELTA-shaped
      # and meta assertions the permanent registry structurally cannot hold —
      # the gate hook + gate-schema byte-invariance fence, the manifest
      # regen-clean check, the origin_issue==43 registry entry count, the
      # registry-append meta guard (no embedded newline; every origin_issue:43
      # literal re-checked in its own predicate's direction), and the
      # three-surface untouched-scope fence. CI has no glob discovery;
      # registered by filename per the sibling suites. See
      # tests/test-issue-43-report-channel-contract.sh.
      - name: Run report-channel contract guard (#43)
        id: s-test-issue-43-report-channel-contract
        if: contains(format(' {0} ', steps.select.outputs.suites), ' tests/test-issue-43-report-channel-contract.sh ')
        timeout-minutes: 10
        run: bash tests/test-issue-43-report-channel-contract.sh

      # init.sh legacy wizard removal + Language Rule user-scope reversion
      # guard (#952): the no-arg usage guard, the removed
      # replace_placeholders/prompt/sed_inplace machinery, the delivered
      # CLAUDE.md Language Rule absence, the submodule-common-rules
      # non-substituted notation, and the README/SETUP-GUIDE stale-template
      # purge must stay asserted. CI has no glob discovery; registered by
      # filename per the sibling suites. See
      # tests/test-issue-952-wizard-removal.sh.
      - name: Run wizard-removal guard (#952)
        id: s-test-issue-952-wizard-removal
        if: contains(format(' {0} ', steps.select.outputs.suites), ' tests/test-issue-952-wizard-removal.sh ')
        timeout-minutes: 10
        run: bash tests/test-issue-952-wizard-removal.sh

      # Subagent run_in_background prohibition guard (#955): the canonical
