<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 488" width="960" height="488" role="img" aria-labelledby="hiw-title hiw-desc">
  <title id="hiw-title">How AutoFlow runs an issue</title>
  <desc id="hiw-desc">An issue comes in. The coordination session builds a workflow for it from modules. A module of your own takes a default module's place. Each module runs in a work session, with the tools that fit its work. The coordination session judges each result and runs the next module. Pull requests wait for your decision.</desc>
  <style>
    svg {
      --bg: #ffffff; --panel: #f6f8fa; --line: #d0d7de; --text: #1f2328; --muted: #656d76;
      --accent: #0969da; --accent-bg: #ddf4ff; --ok: #1a7f37; --block: #ffffff;
      --mine: #8250df; --mine-bg: #fbefff; --tool: #bc4c00; --tool-bg: #fff1e5;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --bg: #0d1117; --panel: #161b22; --line: #30363d; --text: #e6edf3; --muted: #8b949e;
        --accent: #4493f8; --accent-bg: #121d2f; --ok: #3fb950; --block: #0d1117;
        --mine: #a371f7; --mine-bg: #231b3b; --tool: #f0883e; --tool-bg: #2b1a0c;
      }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--text); }
    .tag { font-size: 13px; font-weight: 600; }
    .muted { fill: var(--muted); }
    .small { font-size: 12px; }
    .tiny { font-size: 11px; }
    .name { font-size: 14px; text-anchor: middle; }
    .frame { fill: var(--bg); stroke: var(--line); stroke-width: 1.5; }
    .panel { fill: var(--panel); stroke: var(--line); stroke-width: 1; }
    .card { fill: var(--block); stroke: var(--line); stroke-width: 1.5; }
    .slot { fill: none; stroke: var(--line); stroke-width: 1.5; stroke-dasharray: 5 4; }
    .block { fill: var(--block); stroke: var(--muted); stroke-width: 1.5; }
    .shelf .block { stroke: var(--line); }
    .shelf .name { fill: var(--muted); }
    .mine-panel { fill: var(--mine-bg); stroke: var(--mine); stroke-width: 1; stroke-dasharray: 5 4; }
    .mine-block { fill: var(--mine-bg); stroke: var(--mine); stroke-width: 1.8; }
    .mine-name { fill: var(--mine); font-weight: 600; }
    .tool-panel { fill: var(--tool-bg); stroke: var(--tool); stroke-width: 1; stroke-dasharray: 5 4; }
    .tool-chip { fill: var(--tool-bg); stroke: var(--tool); stroke-width: 1.6; }
    .tool-name { font-size: 12px; text-anchor: middle; fill: var(--tool); font-weight: 600; }
    .wire { fill: none; stroke: var(--line); stroke-width: 1.5; }
    .wire-on { fill: none; stroke: var(--accent); stroke-width: 2.5; }
    .pill { fill: var(--block); stroke: var(--muted); stroke-width: 1.5; }
    .pill-on { fill: var(--accent-bg); stroke: var(--accent); stroke-width: 2.5; }
    .ring { fill: none; stroke: var(--accent); stroke-width: 2.5; }
    .run-label { font-size: 11px; text-anchor: middle; fill: var(--accent); font-weight: 600; }
    .ok { fill: var(--ok); }
    .tick { fill: none; stroke: #ffffff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .caption { font-size: 15px; text-anchor: middle; }
    .arrow { fill: none; stroke: var(--muted); stroke-width: 1.5; }
    .head { fill: var(--muted); }

    .a { animation-duration: 24s; animation-timing-function: linear; animation-iteration-count: infinite; }
    .off { opacity: 0; }

    .issue { animation-name: issue; }
    @keyframes issue {
      0%, 4% { opacity: 1; transform: translate(0, 0); }
      6% { opacity: 0; transform: translate(0, 0); }
      7% { opacity: 0; transform: translate(-30px, 0); animation-timing-function: ease-out; }
      11%, 100% { opacity: 1; transform: translate(0, 0); }
    }

    .i1 { animation-name: rise1; }
    .i2 { animation-name: rise2; }
    .i3 { animation-name: rise3; }
    @keyframes rise1 {
      0%, 4% { opacity: 1; transform: translate(0, 0); }
      6% { opacity: 0; transform: translate(0, 0); }
      6.5%, 15% { opacity: 0; transform: translate(0, 181px); }
      15.5% { opacity: 1; transform: translate(0, 181px); animation-timing-function: ease-in-out; }
      19%, 100% { opacity: 1; transform: translate(0, 0); }
    }
    @keyframes rise2 {
      0%, 4% { opacity: 1; transform: translate(0, 0); }
      6% { opacity: 0; transform: translate(0, 0); }
      6.5%, 18% { opacity: 0; transform: translate(0, 181px); }
      18.5% { opacity: 1; transform: translate(0, 181px); animation-timing-function: ease-in-out; }
      22%, 100% { opacity: 1; transform: translate(0, 0); }
    }
    @keyframes rise3 {
      0%, 4% { opacity: 1; transform: translate(0, 0); }
      6% { opacity: 0; transform: translate(0, 0); }
      6.5%, 21% { opacity: 0; transform: translate(0, 181px); }
      21.5% { opacity: 1; transform: translate(0, 181px); animation-timing-function: ease-in-out; }
      25%, 100% { opacity: 1; transform: translate(0, 0); }
    }

    .i4 { animation-name: rise4; }
    @keyframes rise4 {
      0%, 24% { opacity: 0; transform: translate(0, 181px); }
      24.5% { opacity: 1; transform: translate(0, 181px); animation-timing-function: ease-in-out; }
      28%, 34% { opacity: 1; transform: translate(0, 0); animation-timing-function: ease-in-out; }
      39%, 100% { opacity: 0; transform: translate(0, 181px); }
    }

    .im { animation-name: mine; }
    @keyframes mine {
      0%, 4% { opacity: 1; transform: translate(0, 0); }
      6% { opacity: 0; transform: translate(0, 0); }
      6.5%, 36% { opacity: 0; transform: translate(-548px, 181px); }
      36.5% { opacity: 1; transform: translate(-548px, 181px); animation-timing-function: ease-in-out; }
      43%, 100% { opacity: 1; transform: translate(0, 0); }
    }

    .t1 { animation-name: tool1; } .t3 { animation-name: tool3; } .t4 { animation-name: tool4; }
    @keyframes tool1 {
      0%, 45.5% { opacity: 0; transform: translate(-182px, -74px); }
      46% { opacity: 1; transform: translate(-182px, -74px); animation-timing-function: ease-in-out; }
      48.5%, 53% { opacity: 1; transform: translate(0, 0); }
      54.5%, 100% { opacity: 0; transform: translate(0, 0); }
    }
    @keyframes tool3 {
      0%, 65.5% { opacity: 0; transform: translate(-426px, -38px); }
      66% { opacity: 1; transform: translate(-426px, -38px); animation-timing-function: ease-in-out; }
      68.5%, 73% { opacity: 1; transform: translate(0, 0); }
      74.5%, 100% { opacity: 0; transform: translate(0, 0); }
    }
    @keyframes tool4 {
      0%, 75.5% { opacity: 0; transform: translate(-548px, -74px); }
      76% { opacity: 1; transform: translate(-548px, -74px); animation-timing-function: ease-in-out; }
      78.5%, 83% { opacity: 1; transform: translate(0, 0); }
      84.5%, 100% { opacity: 0; transform: translate(0, 0); }
    }

    .glow { animation-name: glow; }
    @keyframes glow {
      0%, 13% { opacity: 0; }
      14%, 44% { opacity: 1; }
      45%, 52.5% { opacity: 0; }
      53.5%, 55% { opacity: 1; }
      56%, 62.5% { opacity: 0; }
      63.5%, 65% { opacity: 1; }
      66%, 72.5% { opacity: 0; }
      73.5%, 75% { opacity: 1; }
      76%, 82.5% { opacity: 0; }
      83.5%, 85% { opacity: 1; }
      86%, 100% { opacity: 0; }
    }

    .run1 { animation-name: run1; } .run2 { animation-name: run2; } .run3 { animation-name: run3; } .run4 { animation-name: run4; }
    @keyframes run1 { 0%, 46% { opacity: 0; } 46.5%, 53% { opacity: 1; } 54%, 100% { opacity: 0; } }
    @keyframes run2 { 0%, 56% { opacity: 0; } 56.5%, 63% { opacity: 1; } 64%, 100% { opacity: 0; } }
    @keyframes run3 { 0%, 66% { opacity: 0; } 66.5%, 73% { opacity: 1; } 74%, 100% { opacity: 0; } }
    @keyframes run4 { 0%, 76% { opacity: 0; } 76.5%, 83% { opacity: 1; } 84%, 100% { opacity: 0; } }

    .jdg1 { animation-name: jdg1; } .jdg2 { animation-name: jdg2; } .jdg3 { animation-name: jdg3; } .jdg4 { animation-name: jdg4; }
    @keyframes jdg1 { 0%, 52.5% { opacity: 0; } 53.5%, 55% { opacity: 1; } 56%, 100% { opacity: 0; } }
    @keyframes jdg2 { 0%, 62.5% { opacity: 0; } 63.5%, 65% { opacity: 1; } 66%, 100% { opacity: 0; } }
    @keyframes jdg3 { 0%, 72.5% { opacity: 0; } 73.5%, 75% { opacity: 1; } 76%, 100% { opacity: 0; } }
    @keyframes jdg4 { 0%, 82.5% { opacity: 0; } 83.5%, 85% { opacity: 1; } 86%, 100% { opacity: 0; } }

    .chk1 { animation-name: chk1; } .chk2 { animation-name: chk2; } .chk3 { animation-name: chk3; } .chk4 { animation-name: chk4; }
    @keyframes chk1 { 0%, 4% { opacity: 1; } 6%, 53.5% { opacity: 0; } 54.5%, 100% { opacity: 1; } }
    @keyframes chk2 { 0%, 4% { opacity: 1; } 6%, 63.5% { opacity: 0; } 64.5%, 100% { opacity: 1; } }
    @keyframes chk3 { 0%, 4% { opacity: 1; } 6%, 73.5% { opacity: 0; } 74.5%, 100% { opacity: 1; } }
    @keyframes chk4 { 0%, 4% { opacity: 1; } 6%, 83.5% { opacity: 0; } 84.5%, 100% { opacity: 1; } }

    .pr { animation-name: pr; }
    @keyframes pr { 0%, 4% { opacity: 1; } 6%, 86% { opacity: 0; } 89%, 100% { opacity: 1; } }

    .c1 { animation-name: c1; } .c2 { animation-name: c2; } .c3 { animation-name: c3; }
    .c4 { animation-name: c4; } .c5 { animation-name: c5; } .c6 { animation-name: c6; }
    @keyframes c1 { 0%, 7% { opacity: 0; } 8%, 12.5% { opacity: 1; } 13.5%, 100% { opacity: 0; } }
    @keyframes c2 { 0%, 13% { opacity: 0; } 14%, 32.5% { opacity: 1; } 33.5%, 100% { opacity: 0; } }
    @keyframes c3 { 0%, 33% { opacity: 0; } 34%, 44.5% { opacity: 1; } 45.5%, 100% { opacity: 0; } }
    @keyframes c4 { 0%, 45% { opacity: 0; } 46%, 62.5% { opacity: 1; } 63.5%, 100% { opacity: 0; } }
    @keyframes c5 { 0%, 63% { opacity: 0; } 64%, 84.5% { opacity: 1; } 85.5%, 100% { opacity: 0; } }
    @keyframes c6 { 0%, 4% { opacity: 1; } 5.5%, 85% { opacity: 0; } 86%, 100% { opacity: 1; } }

    @media (prefers-reduced-motion: reduce) { .a { animation: none; } }
  </style>

  <defs>
    <marker id="hiw-head" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path class="head" d="M0,0 L8,4 L0,8 Z"/>
    </marker>
  </defs>

  <!-- autoflow-ide: the screen everything is watched on -->
  <rect class="frame" x="8" y="8" width="944" height="472" rx="14"/>
  <text class="tag" x="28" y="36">autoflow-ide<tspan class="muted" font-weight="400"> · the screen you watch the run on</tspan></text>

  <!-- the issue -->
  <g class="a issue">
    <rect class="card" x="36" y="74" width="150" height="58" rx="8"/>
    <text x="50" y="98" font-size="14" font-weight="600">Issue #42</text>
    <text class="small muted" x="50" y="117">Export report as CSV</text>
  </g>
  <path class="arrow" d="M186,103 H382" marker-end="url(#hiw-head)"/>

  <!-- autoflow-coordinator -->
  <rect class="panel" x="216" y="52" width="528" height="260" rx="12"/>
  <text class="tag" x="232" y="74">autoflow-coordinator</text>
  <rect class="pill" x="390" y="82" width="180" height="42" rx="21"/>
  <rect class="pill-on a glow off" x="390" y="82" width="180" height="42" rx="21"/>
  <text x="480" y="108" font-size="14" font-weight="600" text-anchor="middle">Coordination session</text>

  <path class="wire" d="M480,124 V152 M297,152 H663 M297,152 V190 M419,152 V190 M541,152 V190 M663,152 V190"/>
  <path class="wire-on a jdg1 off" d="M297,190 V152 H480 V124"/>
  <path class="wire-on a jdg2 off" d="M419,190 V152 H480 V124"/>
  <path class="wire-on a jdg3 off" d="M541,190 V152 H480 V124"/>
  <path class="wire-on a jdg4 off" d="M663,190 V152 H480 V124"/>

  <rect class="slot" x="244" y="193" width="106" height="44" rx="8"/>
  <rect class="slot" x="366" y="193" width="106" height="44" rx="8"/>
  <rect class="slot" x="488" y="193" width="106" height="44" rx="8"/>
  <rect class="slot" x="610" y="193" width="106" height="44" rx="8"/>
  <text class="tiny muted" x="244" y="302">The workflow for this issue</text>

  <!-- pull request -->
  <path class="arrow" d="M720,215 H756" marker-end="url(#hiw-head)"/>
  <g class="a pr">
    <rect class="card" x="764" y="180" width="166" height="70" rx="8"/>
    <text x="778" y="208" font-size="14" font-weight="600">Pull request</text>
    <text class="small muted" x="778" y="228">ready for your decision</text>
  </g>

  <!-- your tools: set up per repository, added to the work sessions they fit -->
  <rect class="tool-panel" x="36" y="150" width="158" height="164" rx="12"/>
  <text class="tag" x="50" y="174">your tools</text>
  <rect class="tool-chip" x="60" y="190" width="110" height="24" rx="12" opacity="0.5"/>
  <text class="tool-name" x="115" y="206" opacity="0.5">code search</text>
  <rect class="tool-chip" x="60" y="226" width="110" height="24" rx="12" opacity="0.5"/>
  <text class="tool-name" x="115" y="242" opacity="0.5">test runner</text>
  <text class="tiny muted" x="50" y="280">set up per repository,</text>
  <text class="tiny muted" x="50" y="295">added where they fit</text>

  <!-- autoflow-module: the default modules -->
  <rect class="panel" x="216" y="330" width="528" height="104" rx="12"/>
  <text class="tag" x="232" y="354">autoflow-module<tspan class="muted" font-weight="400"> · default modules</tspan></text>
  <text class="small muted" x="728" y="354" text-anchor="end">+ 12 more</text>
  <g class="shelf">
    <rect class="block" x="244" y="374" width="106" height="44" rx="8"/><text class="name" x="297" y="401">analysis</text>
    <rect class="block" x="366" y="374" width="106" height="44" rx="8"/><text class="name" x="419" y="401">design</text>
    <rect class="block" x="488" y="374" width="106" height="44" rx="8"/><text class="name" x="541" y="401">build</text>
    <rect class="block" x="610" y="374" width="106" height="44" rx="8"/><text class="name" x="663" y="401">review</text>
  </g>

  <!-- your modules -->
  <rect class="mine-panel" x="36" y="330" width="158" height="104" rx="12"/>
  <text class="tag" x="50" y="354">your modules</text>
  <rect class="mine-block" x="62" y="374" width="106" height="44" rx="8" opacity="0.45"/>
  <text class="name mine-name" x="115" y="401" opacity="0.45">your-review</text>

  <!-- module instances in the workflow -->
  <g class="a i1"><rect class="block" x="244" y="193" width="106" height="44" rx="8"/><text class="name" x="297" y="220">analysis</text></g>
  <g class="a i2"><rect class="block" x="366" y="193" width="106" height="44" rx="8"/><text class="name" x="419" y="220">design</text></g>
  <g class="a i3"><rect class="block" x="488" y="193" width="106" height="44" rx="8"/><text class="name" x="541" y="220">build</text></g>
  <g class="a i4 off"><rect class="block" x="610" y="193" width="106" height="44" rx="8"/><text class="name" x="663" y="220">review</text></g>
  <g class="a im"><rect class="mine-block" x="610" y="193" width="106" height="44" rx="8"/><text class="name mine-name" x="663" y="220">your-review</text></g>

  <!-- a module running in a work session -->
  <g class="a run1 off"><rect class="ring" x="241" y="190" width="112" height="50" rx="10"/><text class="run-label" x="297" y="256">work session</text></g>
  <g class="a run2 off"><rect class="ring" x="363" y="190" width="112" height="50" rx="10"/><text class="run-label" x="419" y="256">work session</text></g>
  <g class="a run3 off"><rect class="ring" x="485" y="190" width="112" height="50" rx="10"/><text class="run-label" x="541" y="256">work session</text></g>
  <g class="a run4 off"><rect class="ring" x="607" y="190" width="112" height="50" rx="10"/><text class="run-label" x="663" y="256">work session</text></g>

  <!-- tools added to the work sessions they fit -->
  <g class="a t1 off"><rect class="tool-chip" x="242" y="264" width="110" height="24" rx="12"/><text class="tool-name" x="297" y="280">code search</text></g>
  <g class="a t3 off"><rect class="tool-chip" x="486" y="264" width="110" height="24" rx="12"/><text class="tool-name" x="541" y="280">test runner</text></g>
  <g class="a t4 off"><rect class="tool-chip" x="608" y="264" width="110" height="24" rx="12"/><text class="tool-name" x="663" y="280">code search</text></g>

  <!-- judged -->
  <g class="a chk1"><circle class="ok" cx="346" cy="195" r="9"/><path class="tick" d="M342,195 l3,3 l5,-6"/></g>
  <g class="a chk2"><circle class="ok" cx="468" cy="195" r="9"/><path class="tick" d="M464,195 l3,3 l5,-6"/></g>
  <g class="a chk3"><circle class="ok" cx="590" cy="195" r="9"/><path class="tick" d="M586,195 l3,3 l5,-6"/></g>
  <g class="a chk4"><circle class="ok" cx="712" cy="195" r="9"/><path class="tick" d="M708,195 l3,3 l5,-6"/></g>

  <!-- captions -->
  <text class="caption a c1 off" x="480" y="461">1 · An issue comes in.</text>
  <text class="caption a c2 off" x="480" y="461">2 · The coordination session builds a workflow for it from modules.</text>
  <text class="caption a c3 off" x="480" y="461">3 · A module of your own takes a default module's place.</text>
  <text class="caption a c4 off" x="480" y="461">4 · Each module runs in a work session, with the tools that fit its work.</text>
  <text class="caption a c5 off" x="480" y="461">5 · The coordination session judges each result and runs the next module.</text>
  <text class="caption a c6" x="480" y="461">6 · Pull requests wait for your decision.</text>
</svg>
