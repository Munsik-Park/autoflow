#
# The design module's contract — DRAFT (issues #508, #509, epic #507). Format:
# docs/records/design-reviews/io-contract-modules.md > 5. Contract format and module invocation.
# No device reads this file yet.

contract: 1
module: design
kind: functional
goal: >
  A design the build module can implement and verify: the architecture decisions with the
  constraints they hold under and the alternatives rejected, and a verification design that says
  how each acceptance criterion is verified and which failure mode each verification catches.
procedure: docs/units/design.md

params:
  issue:
    type: issue-number
    required: true

inputs:
  applied_criteria:
    required: true
    from: { module: criteria-apply, output: applied_criteria }
  analysis:
    required: true
    from: { module: analysis, output: report }
  hypothesis_evaluation:
    required: true
    from: { module: hypothesis, output: evaluation }
  decisions:
    required: false
    from: { ledger: [ac-decision, design-point] }
  target_documents:
    required: false
    from: { path: target }
  # A re-run: the previous documents and the material it is for.
  previous_feature_design:
    required: false
    from: { module: design, output: feature_design }
  previous_verification_design:
    required: false
    from: { module: design, output: verification_design }
  plan_evaluation:
    required: false
    from: { module: plan, output: evaluation }
  green_blocker:
    required: false
    from: { module: build, output: green_blocker }
  failed_items:
    required: false
    from: { module: quality, output: evaluation }

rules:
  - id: delta-not-rewrite
    check: mechanical
    rule: >
      On a re-run, each output document the run changes is the previous document unchanged, then
      one appended section "## Delta — round <n>", n being the number of delta sections in the
      previous document plus one; what the round is for, the module states from its inputs (Q13).
      "## Decision requests" is the exception: rewritten in place to its current state.
    source: docs/units/design.md > Re-entry

# Q14: a contract checks the inputs and that the output disposes of every item the work owes —
# each applied acceptance criterion and each item the design adds. How the work is done (the
# verification design's risk line, what the feature design leaves to the build) is the
# procedure's, not this contract's. No rule that the design never applies an acceptance-criterion
# change (Q15): the applied criteria are criteria-apply's output, an input here, so the design can
# only request one ("## Decision requests").
outputs:
  feature_design:
    file: feature-design.md
    format: markdown
    sections:
      - heading: Scope
        required: true
        empty: none
        check: mechanical
        entries:
          - kind: included item
            holds: [id, the item]
            note: the id names the item in the verification design's table
      - heading: Decision requests
        required: true
        empty: none
        check: mechanical
        entries:
          - kind: acceptance-criterion content change
            holds: [criterion, proposed change, fact that shows the need]
          - kind: design point
            holds: [options, what each changes]

  verification_design:
    file: verification-design.md
    format: markdown
    tables:
      # Every item the work owes has a disposition: each applied acceptance criterion and each
      # item the feature design's "## Scope" includes (Q8, Q14). How an item is verified, or why it
      # is not, is the module's judgment in its own words; no classification of it is checked.
      # The table the first run wrote is the one outside every "## Delta — round <n>" section: a
      # re-run appends a delta and leaves that table as it stands (docs/units/design.md > Re-entry).
      - locate: >
          the table whose header row's first cell is "Item", outside every
          "## Delta — round <n>" section
        required: true
        check: mechanical
        columns:
          first: Item
          rest: the module's own
        rows:
          rule: a row carries its disposition — at least one cell after Item is not empty
          check: mechanical
        coverage:
          rule: >
            every AC id of applied_criteria, and every id of an included item of the feature
            design's "## Scope", has at least one row
          check: mechanical
          source: docs/evaluation-system.md > GATE:PLAN > AC-authority check; docs/units/design.md > Output artifacts (the Issue AC bullet)
    # No "## Tools" section (Q10): a tool the run lacked is a tool request in the result
    # (docs/records/design-reviews/io-contract-modules.md > 5.3).

result:
  summary: one line
