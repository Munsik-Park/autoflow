#
# The analysis evaluation module's contract (today's GATE:HYPOTHESIS) — DRAFT (issue #509, epic #507).
# Format: docs/records/design-reviews/io-contract-modules.md > 5. Contract format and module
# invocation. No device reads this file yet.

contract: 1
module: hypothesis
kind: evaluation
goal: >
  Scores of whether the analysis report's conclusion is supported by its grounds and whether the
  analysis reached its goal — never the method by which it was reached.
procedure: docs/evaluation-system.md > Gate rubrics — GATE:HYPOTHESIS, GATE:PLAN, AUDIT, GATE:QUALITY > GATE:HYPOTHESIS
evaluator:
  agent: autoflow-evaluator
  spawn: fresh, every run

params:
  issue:
    type: issue-number
    required: true

inputs:
  analysis:
    required: true
    from: { module: analysis, output: report }
  decisions:
    required: false
    from: { ledger: [ac-decision] }
  previous_evaluation:
    required: false
    from: { module: hypothesis, output: evaluation }

outputs:
  evaluation:
    file: evaluation.json
    format: json
    writer: the invoking session, writing the report the evaluator returns verbatim (Q7)
    keys:
      type:   { type: string, required: true, const: hypothesis_evaluation }
      issue:  { type: string, required: true, pattern: '^#[0-9]+$' }
      scores:
        type: object
        required: true
        keys_exactly: [Conclusion grounds, Goal coverage]
        value: a number 0-10, or { score, reason }
      rescore:
        type: object
        required_when: previous_evaluation is given
        keys: [source, rescored, inherited, prior_findings]
        rules:
          - every rubric item is in exactly one of rescored and inherited
          - every finding of previous_evaluation has an entry in prior_findings, with its disposition
      summary: { type: string, required: true }
      recommendations:
        type: array
        required: true
        items:
          keys: [subject, item, finding]
    forbidden_keys: [verdict]
    check: mechanical

reference:
  pass:
    average_at_least: 7.5
    each_item_at_least: 7
  source: docs/evaluation-system.md > PASS Criteria

result:
  summary: one line
