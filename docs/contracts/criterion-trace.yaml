#
# The criterion review's second module (today's stage 2: cause reach and rule conflict) — DRAFT (issue #509, epic #507).
# Format: docs/records/design-reviews/io-contract-modules.md > 5. Contract format and module
# invocation. No device reads this file yet.

contract: 1
module: criterion-trace
kind: functional
goal: >
  How far each cause the review confirmed reaches beyond the points the issue reports, and whether
  each behaviour a criterion requires conflicts with the rules the code already has — assuming no
  fix.
procedure: docs/criterion-review.md

params:
  issue:
    type: issue-number
    required: true

inputs:
  # Only these: the module runs in a context that carries nothing else of the review.
  review_record:
    required: true
    from: { module: criterion-screen, output: review_record }

outputs:
  trace:
    file: trace.md
    format: markdown
    rows:
      rule: each finding with its grounds, and whether the review record already has it
      check: evaluation
    empty: none

result:
  summary: one line
