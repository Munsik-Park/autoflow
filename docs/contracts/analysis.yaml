#
# The analysis module's contract (today's DIAGNOSE) — DRAFT (issue #509, epic #507).
# Format: docs/records/design-reviews/io-contract-modules.md > 5. Contract format and module
# invocation. No device reads this file yet.

contract: 1
module: analysis
kind: functional
goal: >
  The request understood well enough to be evaluated: the affected structure as it stands, the gap
  between it and the requested behaviour, whether a change is owed and whether code is the lever,
  and the decision points, each conclusion with its grounds.
procedure: docs/units/analysis.md

params:
  issue:
    type: issue-number
    required: true

inputs:
  criterion_review:
    required: false
    from: { module: criterion-reconcile, output: review_record }
  decisions:
    required: false
    from: { ledger: [ac-decision, criterion-ready] }
  target_documents:
    required: false
    from: { path: target }
  # A re-run: the previous report and the material it is for.
  previous_report:
    required: false
    from: { module: analysis, output: report }
  hypothesis_evaluation:
    required: false
    from: { module: hypothesis, output: evaluation }

outputs:
  report:
    file: analysis.md
    format: markdown
    sections:
      - heading: Acceptance criteria
        required: true
        check: mechanical
        # criteria-apply reads this table.
        tables:
          - locate: the first table under the heading
            columns: [AC id, criterion, source]
            rows:
              rule: ids are unique, and every criterion of the issue body has a row
              check: evaluation
      - heading: Necessity
        required: true
        check: mechanical
        note: whether a change is owed and whether code is the lever, with its grounds
      - heading: Decision points
        required: true
        empty: none
        check: mechanical

result:
  summary: one line, naming any decision point
