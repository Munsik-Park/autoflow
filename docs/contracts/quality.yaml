#
# The quality evaluation module's contract (today's GATE:QUALITY) — DRAFT (issue #509, epic #507).
# Format: docs/records/design-reviews/io-contract-modules.md > 5. Contract format and module
# invocation. No device reads this file yet.

contract: 1
module: quality
kind: evaluation
goal: >
  Scores of the built change against the acceptance criteria, the design and the build's own
  records — complete, correct, verified, within the cycle's scope, committed and documented.
procedure: docs/evaluation-system.md > Gate rubrics — GATE:HYPOTHESIS, GATE:PLAN, AUDIT, GATE:QUALITY > GATE:QUALITY
evaluator:
  agent: autoflow-evaluator
  spawn: fresh, every run

params:
  issue:
    type: issue-number
    required: true

inputs:
  commits:
    required: true
    from: { module: build, output: commits }
  applied_criteria:
    required: true
    from: { module: criteria-apply, output: applied_criteria }
  analysis:
    required: true
    from: { module: analysis, output: report }
  feature_design:
    required: true
    from: { module: design, output: feature_design }
  verification_design:
    required: true
    from: { module: design, output: verification_design }
  build_report:
    required: true
    from: { module: build, output: report }
  audit_evaluation:
    required: true
    from: { module: audit, output: evaluation }
  decisions:
    required: false
    from: { ledger: [ac-decision] }
  previous_evaluation:
    required: false
    from: { module: quality, output: evaluation }

outputs:
  evaluation:
    file: evaluation.json
    format: json
    writer: the invoking session, writing the report the evaluator returns verbatim (Q7)
    keys:
      type:   { type: string, required: true, const: quality_evaluation }
      issue:  { type: string, required: true, pattern: '^#[0-9]+$' }
      scores:
        type: object
        required: true
        keys_exactly: [Completeness, Quality, Test coverage, Test quality, Security, Fit, Impact scope, Minimal implementation, Commit conventions, Doc updates]
        value: a number 0-10, or { score, reason }
      rescore:
        type: object
        required_when: previous_evaluation is given
        keys: [source, rescored, inherited, prior_findings]
        rules:
          - every rubric item is in exactly one of rescored and inherited
          - every finding of previous_evaluation has an entry in prior_findings, with its disposition
      summary: { type: string, required: true }
      recommendations:
        type: array
        required: true
        items:
          keys: [subject, item, finding]
    forbidden_keys: [verdict]
    check: mechanical

reference:
  pass:
    average_at_least: 7.5
    each_item_at_least: 7
    security_rework_at_or_below: 3
  source: docs/evaluation-system.md > PASS Criteria

result:
  summary: one line
