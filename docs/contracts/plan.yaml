#
# The plan evaluation module's contract (today's GATE:PLAN) — DRAFT (issue #508, epic #507).
# Format: docs/records/design-reviews/io-contract-modules.md > 5. Contract format and module
# invocation. No device reads this file yet.

contract: 1
module: plan
kind: evaluation
goal: >
  Scores of the design's intent — whether each decision is grounded, whether each criterion's
  verification fits it, whether the scope is right and whether the tools are secured — never the
  method by which the design was reached.
procedure: docs/evaluation-system.md > Gate rubrics — GATE:HYPOTHESIS, GATE:PLAN, AUDIT, GATE:QUALITY > GATE:PLAN
evaluator:
  agent: autoflow-evaluator
  spawn: fresh, every run

params:
  issue:
    type: issue-number
    required: true

inputs:
  feature_design:
    required: true
    from: { module: design, output: feature_design }
  verification_design:
    required: true
    from: { module: design, output: verification_design }
  applied_criteria:
    required: true
    from: { module: criteria-apply, output: applied_criteria }
  decisions:
    required: false
    from: { ledger: [ac-decision] }
  # A re-score: the previous report, whose unchanged items are inherited by citation.
  previous_evaluation:
    required: false
    from: { module: plan, output: evaluation }

rules:
  - id: narrowed-rescore
    check: evaluation
    rule: >
      With previous_evaluation given, the evaluator re-scores the items the design's delta sections
      touch and inherits the others by citation; rescore.source names previous_evaluation.
    source: docs/evaluation-system.md > GATE:PLAN > Re-entry re-score

outputs:
  evaluation:
    file: evaluation.json
    format: json
    writer: >
      the invoking session, writing the report the evaluator returns verbatim — the evaluator agent
      has no Write tool (agents/autoflow-evaluator.md). Open: sub-issue 2.
    keys:
      type:            { type: string, required: true, const: plan_evaluation }
      target:          { type: string, required: true }
      issue:           { type: string, required: true, pattern: '^#[0-9]+$' }
      fail_hypothesis:
        type: object
        required: true
        keys:
          case:         { type: string, required: true, non_empty: true }
          disposition:  { type: string, required: true, enum: [refuted, survived, none_found] }
          reflected_in: { type: array, required: true, items: rubric item name }
      scores:
        type: object
        required: true
        keys_exactly: [Decision grounds, Verification fit, Scope, Tools, Security]
        value: a number 0-10, or { score, reason }
      rescore:
        type: object
        required_when: previous_evaluation is given
        keys: [source, rescored, inherited, prior_findings, new_findings]
        rule: every rubric item is in exactly one of rescored and inherited
      summary:         { type: string, required: true }
      blocking_issues: { type: array, required: true, max_items: 3 }
      recommendations:
        type: array
        required: true
        items:
          keys: [subject, item, severity, finding]
          remedy_class:
            required_when: severity is Medium or above
            enum: [doc, test, impl, design, operator]
    forbidden_keys:
      - verdict  # Q2: the evaluation outputs scores; applying the pass values is the Coordinator's
    check: mechanical

# Q2: the reference values AutoFlow provides with the evaluation, for the Coordinator to apply.
reference:
  pass:
    average_at_least: 7.5
    each_item_at_least: 7
    security_rework_at_or_below: 3
  source: docs/evaluation-system.md > PASS Criteria

result:
  summary: one line
