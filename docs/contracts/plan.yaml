#
# The plan evaluation module's contract (today's GATE:PLAN) — DRAFT (issues #508, #509, epic #507).
# Format: docs/records/design-reviews/io-contract-modules.md > 5. Contract format and module
# invocation. No device reads this file yet.

contract: 1
module: plan
kind: evaluation
goal: >
  Scores of the design's intent — whether each decision is grounded, whether each criterion's
  verification fits it and whether the scope is right — never the method by which the design was
  reached.
procedure: docs/evaluation-system.md > Gate rubrics — GATE:HYPOTHESIS, GATE:PLAN, AUDIT, GATE:QUALITY > GATE:PLAN
evaluator:
  agent: autoflow-evaluator
  spawn: fresh, every run

params:
  issue:
    type: issue-number
    required: true

inputs:
  feature_design:
    required: true
    from: { module: design, output: feature_design }
  verification_design:
    required: true
    from: { module: design, output: verification_design }
  applied_criteria:
    required: true
    from: { module: criteria-apply, output: applied_criteria }
  decisions:
    required: false
    from: { ledger: [ac-decision] }
  # A re-score: the previous report, whose unchanged items are inherited by citation.
  previous_evaluation:
    required: false
    from: { module: plan, output: evaluation }

# No rules of procedure (Q15): which items a re-score scores afresh is the evaluation procedure's
# (docs/evaluation-system.md > GATE:PLAN > Re-entry re-score); the contract checks only that the
# re-score disposes of every item it owes (outputs.evaluation.keys.rescore).

outputs:
  evaluation:
    file: evaluation.json
    format: json
    writer: >
      the invoking session, writing the report the evaluator returns verbatim — the evaluator holds
      no Write tool, so its return value is the only delivery path for its scores
      (docs/role-contracts.md > Evaluation AI). Q7.
    keys:
      type:            { type: string, required: true, const: plan_evaluation }
      target:          { type: string, required: true }
      issue:           { type: string, required: true, pattern: '^#[0-9]+$' }
      # No fail_hypothesis (Q12): the pre-scoring search for the opposite case is the evaluation
      # procedure's rule (docs/evaluation-system.md > Evaluator conduct), not an output's format.
      scores:
        type: object
        required: true
        # No Tools item (Q10): it scored the design's "## Tools" section, which is removed.
        keys_exactly: [Decision grounds, Verification fit, Scope, Security]
        value: a number 0-10, or { score, reason }
      rescore:
        type: object
        required_when: previous_evaluation is given
        keys: [source, rescored, inherited, prior_findings]
        rules:
          - every rubric item is in exactly one of rescored and inherited
          - every finding of previous_evaluation has an entry in prior_findings, with its disposition
      summary:         { type: string, required: true }
      # No blocking_issues (Q15): nothing reads it, and its cap of three cut what the scores'
      # reasons carry in full.
      recommendations:
        type: array
        required: true
        items:
          keys: [subject, item, finding]
          # No remedy_class (Q11) and no severity (Q15): what to do with a finding is decided by
          # whoever acts on it.
    forbidden_keys:
      - verdict  # Q2: the evaluation outputs scores; applying the pass values is the Coordinator's
    check: mechanical

# Q2: the reference values AutoFlow provides with the evaluation, for the Coordinator to apply.
reference:
  pass:
    average_at_least: 7.5
    each_item_at_least: 7
    security_rework_at_or_below: 3
  source: docs/evaluation-system.md > PASS Criteria

result:
  summary: one line
