#
# The criterion review's in-depth module (one run per criterion with an in-depth target) — DRAFT (issue #509, epic #507).
# Format: docs/records/design-reviews/io-contract-modules.md > 5. Contract format and module
# invocation. No device reads this file yet.

contract: 1
module: criterion-in-depth
kind: functional
goal: >
  A verdict on each target case of one criterion, resting on the code that decides whether and how
  the required behaviour occurs and the condition applied there.
procedure: docs/criterion-review.md

params:
  issue:
    type: issue-number
    required: true
  criterion:
    type: string
    required: true

inputs:
  # Only the target file: the module never sees the review's verdicts or grounds.
  target:
    required: true
    from: { module: criterion-screen, output: targets }

outputs:
  in_depth:
    file: in-depth.md
    format: markdown
    coverage:
      rule: every case of the target has its verdict, the deciding code and condition, and the grounds
      check: evaluation

result:
  summary: one line
